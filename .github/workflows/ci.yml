# Runs the same three suites as CONTRIBUTING.md. None of them needs a TV.
# Note: written without being run on GitHub's runners yet; if it fails for an environment reason, fix the workflow.
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Script tests
        run: |
          bash scripts/tests/test-cleanup.sh
          bash scripts/tests/test-install.sh
      - name: Launcher unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
